<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="_css/login.css" />
    <title>Login - WebDev</title>
</head>

<body>
    <!--logo header -->
    <header>
        <a href="Index.html"><img id="logo" src="_imagens/Logo.png" alt="Refashion"></a>
    </header>
    <!-- Seta voltar -->
    <a href="Index.html" class="seta"><img src="_imagens/seta.png"></a>

    <!-- Botoes logino -->
    <div class="botoes">
        <div class="botao-google">
            <button>
                <img src="_imagens/icone-google.png" alt="Ícone do Google">
                <p>entrar com google</p>
            </button>
        </div>
        <div class="botao botao-facebook">
            <img src="_imagens/icone-facebook.png" alt="Ícone do Facebook">
            <button>entrar com facebook</button>
        </div>
        <div class="botao botao-email">
            <button>entrar com email</button>
        </div>
    </div>

    <!-- Separador login -->
    <div class="ou-separador">
        <hr>
        <p>ou</p>
        <hr>
    </div>

    <!-- Botao criar conta -->
    <div class="criar-conta">
        <a href="email.html">
            <button>criar conta</button>
        </a>
    </div>

</body>

</html>
